services:
  token-monitor:
    build: .
    image: token-monitor-server:latest
    container_name: token-monitor
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      LISTEN_ADDR: ":8765"
      DB_PATH: /data/token-monitor.db
      TZ: Asia/Shanghai
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "/app/token-monitor-server", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
